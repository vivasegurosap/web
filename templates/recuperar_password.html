<!DOCTYPE html>
<html>

<head>

    <title>Recuperar contraseña</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">

    <style>

        body{

            background:#f4f6f8;

            font-family:Segoe UI;

        }

        .card{

            width:420px;

            margin:80px auto;

            background:white;

            padding:35px;

            border-radius:12px;

            box-shadow:0 10px 25px rgba(0,0,0,.15);

        }

        h2{

            text-align:center;

            color:#1F7A83;

            margin-bottom:25px;

        }

        p{

            margin-bottom:20px;

            color:#555;

        }

    </style>

</head>

<body>

<div class="card">

<h2>Recuperar contraseña</h2>

<p>

Ingrese el correo registrado en VivaAP.

Le enviaremos una contraseña temporal para que pueda ingresar nuevamente al sistema.

</p>

<form method="POST">

    <input
        type="email"
        name="correo"
        placeholder="Correo electrónico"
        required>

    <button type="submit">
    Enviar contraseña temporal
</button>

</form>

<br>

<div style="text-align:center;">

<a href="{{ url_for('login') }}">

Volver al inicio

</a>

</div>

</div>

</body>

</html>
