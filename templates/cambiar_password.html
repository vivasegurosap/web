<!DOCTYPE html>
<html>

<head>

    <title>Cambiar contraseña</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
          rel="stylesheet">

<style>

body{

    margin:0;
    font-family:'Inter',sans-serif;
    background:#f4f6f8;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

}

.card{

    width:430px;

    background:white;

    padding:40px;

    border-radius:14px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);

    animation:aparecer .35s;

}

.logo{

    width:180px;

    display:block;

    margin:auto;

    margin-bottom:25px;

}

h2{

    color:#1F7A83;

    text-align:center;

    margin-bottom:10px;

}

p{

    color:#666;

    text-align:center;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:12px;

    border:1px solid #d7d7d7;

    border-radius:8px;

    margin-bottom:15px;

    font-size:15px;

}

input:focus{

    outline:none;

    border-color:#1F7A83;

    box-shadow:0 0 10px rgba(31,122,131,.25);

}

.password{

    position:relative;

}

.password span{

    position:absolute;

    right:15px;

    top:12px;

    cursor:pointer;

}

button{

    width:100%;

    padding:13px;

    background:#1F7A83;

    color:white;

    border:none;

    border-radius:8px;

    font-size:15px;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    background:#17656d;

}

#fortaleza{

    text-align:center;

    margin-bottom:18px;

    font-weight:600;

}

.error{

    color:#c62828;

}

.ok{

    color:#2e7d32;

}

@keyframes aparecer{

from{

opacity:0;

transform:translateY(15px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="card">

<img
src="{{ url_for('static', filename='Logo.png') }}"
class="logo">

<h2>Cambiar contraseña</h2>

<p>

Por seguridad debe crear una nueva contraseña antes de ingresar a VivaAP.

</p>

{% with messages = get_flashed_messages() %}
{% if messages %}

{% for m in messages %}

<p class="error">

{{ m }}

</p>

{% endfor %}

{% endif %}
{% endwith %}

<form method="POST">

<div class="password">

<input
type="password"
id="password"
name="password"
placeholder="Nueva contraseña"
required>

<span onclick="mostrar('password')">👁</span>

</div>

<div class="password">

<input
type="password"
id="confirmar"
name="confirmar"
placeholder="Confirmar contraseña"
required>

<span onclick="mostrar('confirmar')">👁</span>

</div>

<div id="fortaleza"></div>

<button>

Guardar contraseña

</button>

</form>

</div>

<script>

function mostrar(id){

let c=document.getElementById(id);

c.type=(c.type==="password")?"text":"password";

}

const pass=document.getElementById("password");

const fuerza=document.getElementById("fortaleza");

pass.addEventListener("keyup",()=>{

let p=pass.value;

let nivel=0;

if(p.length>=8)nivel++;

if(/[A-Z]/.test(p))nivel++;

if(/[0-9]/.test(p))nivel++;

if(/[!@#$%^&*(),.?":{}|<>]/.test(p))nivel++;

if(nivel<=1){

fuerza.innerHTML="Seguridad: Débil";

fuerza.className="error";

}
else if(nivel==2){

fuerza.innerHTML="Seguridad: Media";

fuerza.className="";

}
else{

fuerza.innerHTML="Seguridad: Fuerte";

fuerza.className="ok";

}

});

</script>

</body>

</html>
